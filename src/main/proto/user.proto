syntax = "proto3";
import "google/protobuf/empty.proto";

package user.v1;

option java_multiple_files = true;
option java_package = "user.contract.v1";

service UserRpcService {
  rpc GetUserHealth(google.protobuf.Empty) returns (GetUserHealthGrpcResponse);
  rpc GetUserInfo(GetUserInfoGrpcRequest) returns (GetUserInfoGrpcResponse);
  rpc GetAllUserInfo(google.protobuf.Empty) returns (GetAllUserInfoGrpcResponse);
  rpc GetRecipientByEmail(GetRecipientByEmailRequest) returns (GetRecipientResponse);
}

message GetUserHealthGrpcResponse {
  string message = 1;
}

message GetUserInfoGrpcRequest {
  string authUserId = 1;
  string role = 2;
}

message UserResponse {
  string userProfileId = 1;
  string authUserId = 2;
  string email = 3;
  string firstName = 4;
  string lastName = 5;
  string status = 6;
}

message RecipientResponse {
  string userProfileId = 1;
  string email = 2;
  string firstName = 3;
  string lastName = 4;
}

message GetRecipientResponse {
  RecipientResponse user = 1;
}

message GetUserInfoGrpcResponse {
  UserResponse user = 1;
}

message GetAllUserInfoGrpcResponse {
  repeated  UserResponse users = 1;
}

message GetRecipientByEmailRequest {
  string email = 1;
}
